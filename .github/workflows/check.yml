name: Check

# Every pull request: the site builds (the build also checks the links) and the release pages have their sections.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The required status check of develop and main.
    name: Check passed
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned tools (mise.toml)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: mise run install
      - name: Lint (gitleaks, actionlint)
        run: mise run lint
      - name: Build
        run: mise run build
      - name: Check the release pages
        run: mise run check:releases
